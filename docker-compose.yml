# Pip's Sparkle Maze with accounts, saved scores and star totals.
#   cp .env.example .env    (then fill it in, see the README)
#   docker compose up --build
# The game is at http://localhost:8000. MySQL keeps its data in the "mysql-data" volume.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sparkle
      MYSQL_USER: sparkle
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"   # so you can poke at it with a MySQL client; only reachable from this machine
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u sparkle -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://sparkle:${MYSQL_PASSWORD}@db:3306/sparkle?charset=utf8mb4
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  mysql-data:
